<text x="65" y="625" class="dark" font-size="14">Evidence checklist: request • response • user role • timestamp • sanitized notes • retest status</text><text x="28" y="790" fill="#fbbf24" font-size="15" font-weight="700">SIMULATED TOOL SCREENSHOT — sample interface and synthetic result; not a real scan or captured session.</text>
