<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" rx="18" fill="#111827"/><rect width="1200" height="64" rx="18" fill="#1f2937"/><circle cx="34" cy="32" r="9" fill="#f87171"/><circle cx="64" cy="32" r="9" fill="#fbbf24"/><circle cx="94" cy="32" r="9" fill="#34d399"/><text x="132" y="41" fill="#e5e7eb" font-family="monospace" font-size="22">WEB APPLICATION PENTEST — RESULT REVIEW</text><text x="50" y="130" fill="#93c5fd" font-family="monospace" font-size="26">$ review-evidence --compare baseline test</text><text x="50" y="200" fill="#d1d5db" font-family="monospace" font-size="22">Observation: compare normal and test behavior</text><text x="50" y="260" fill="#d1d5db" font-family="monospace" font-size="22">Validation: reproduce manually in the lab</text><text x="50" y="320" fill="#d1d5db" font-family="monospace" font-size="22">Finding: analyst must verify before reporting</text><rect x="40" y="500" width="1120" height="70" rx="10" fill="#7c2d12"/><text x="64" y="544" fill="#ffedd5" font-family="sans-serif" font-size="24">SIMULATED TRAINING ILLUSTRATION — NOT REAL TEST EVIDENCE</text></svg>