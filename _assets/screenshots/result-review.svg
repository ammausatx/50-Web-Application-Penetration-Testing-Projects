<rect x="480" y="496" width="395" height="74" rx="6" fill="#fef3c7"/><text x="500" y="525" class="amber" font-size="16" font-weight="bold">MANUAL VALIDATION</text><text x="500" y="549" class="dark" font-size="13">Repeat with separate disposable lab users</text>
