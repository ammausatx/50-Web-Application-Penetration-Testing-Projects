<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<style>.ui{font:15px Arial,sans-serif;fill:#e5e7eb}.small{font:12px Arial,sans-serif;fill:#cbd5e1}.dark{fill:#172033}.mono{font:13px 'DejaVu Sans Mono',monospace;fill:#1e293b}.green{fill:#047857}.amber{fill:#92400e}.red{fill:#b91c1c}</style>
<rect width="1440" height="820" fill="#0b1220"/><rect width="1440" height="42" fill="#1e293b"/><circle cx="22" cy="21" r="6" fill="#fb7185"/><circle cx="43" cy="21" r="6" fill="#fbbf24"/><circle cx="64" cy="21" r="6" fill="#34d399"/><text x="90" y="27" class="ui">Burp Suite — Target / Issue review (simulated training workspace)</text>
<rect x="25" y="65" width="1390" height="690" rx="8" fill="#f1f5f9" stroke="#475569"/><rect x="25" y="65" width="1390" height="38" rx="8" fill="#24364b"/><text x="48" y="90" class="ui">Dashboard   Target   Proxy   Repeater   Intruder   Logger   Scanner</text>
<rect x="45" y="120" width="420" height="300" fill="#fff" stroke="#cbd5e1"/><text x="65" y="151" class="dark" font-size="17" font-weight="bold">Site map / request history</text><text x="65" y="190" class="mono">GET  /                         200</text><text x="65" y="222" class="mono">GET  /login                    200</text><text x="65" y="254" class="mono">POST /api/login                401</text><text x="65" y="286" class="mono">GET  /api/profile              200</text><text x="65" y="318" class="mono">GET  /api/orders/1001          403</text><text x="65" y="370" class="small">Example requests from a synthetic lab target</text>
<rect x="485" y="120" width="905" height="300" fill="#fff" stroke="#cbd5e1"/><text x="510" y="151" class="dark" font-size="17" font-weight="bold">Response inspector</text><text x="510" y="190" class="mono">HTTP/1.1 403 Forbidden</text><text x="510" y="222" class="mono">Content-Type: application/json</text><text x="510" y="254" class="mono">{"error":"forbidden","message":"Access denied"}</text><text x="510" y="302" class="green" font-size="14">Interpretation: server-side access control appears to block this test request.</text><text x="510" y="338" class="small">Do not treat this illustrative response as evidence from a real system.</text>
<rect x="45" y="440" width="1345" height="275" fill="#fff" stroke="#cbd5e1"/><text x="65" y="474" class="dark" font-size="18" font-weight="bold">Analyst result summary</text>
