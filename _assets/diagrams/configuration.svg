  <text x="130" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1f2937"><tspan x="130" dy="14">curl / Burp against live</tspan><tspan x="130" dy="14">endpoint</tspan></text>

