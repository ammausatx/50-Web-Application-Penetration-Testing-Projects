  <text x="410" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1f2937"><tspan x="410" dy="14">missing header, weak</tspan><tspan x="410" dy="14">cipher, or open method</tspan></text>

